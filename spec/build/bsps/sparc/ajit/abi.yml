  value:
  - -mcpu=v8
  - -DSPARC_BSP_AJIT
description: |
  ABI flags.  AJIT is a generic SPARC V8 (-mcpu=v8) and has no -mcpu-derived
  identifying macro, so -DSPARC_BSP_AJIT is defined to let the shared SPARC
  CPU-port code (cpukit/score/cpu/sparc/sparc-bad-trap.S) select the AJIT
  %asr29 processor-index path under SMP.
enabled-by: true
links: []
