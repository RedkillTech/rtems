  value: 100
description: |
  AJIT processor clock frequency in MHz. The BSP uses this value for the
  count-down timer reload (cycles per tick) and for converting ASR31 cycle
  counts to time. The default of 100 matches the AJIT QEMU model
  (AJIT1_CPU_CLK). Real silicon typically runs at 80 MHz.
enabled-by: true
format: '{}'
links: []
name: AJIT_CLOCK_SPEED_MHZ
type: build
